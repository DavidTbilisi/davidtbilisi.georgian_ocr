<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- UIkit CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.6.18/dist/css/uikit.min.css" />

    <!-- UIkit JS -->
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.6.18/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.6.18/dist/js/uikit-icons.min.js"></script>


    <title>Georgian OCR</title>
</head>
<body>
  <div class="uk-container uk-section">
    <div uk-grid class="uk-grid-small uk-child-width-expand">  
          <div>
            <input id="file" type="file" class="uk-input ">
          </div>

          <div>
            <select id="language" class="uk-select ">
                <option value="kat">ქართული</option>
                <option value="rus">რუსული</option>
                <option value="eng">ინგლისური</option>
            </select>
          </div>

          <div>
            <button class="uk-button uk-button-primary uk-width-expand" id="convert">Convert</button>
          </div>
      </div>
    <br>
      
    <span class="show-progress"> </span>
    <progress class="uk-progress" id="js-progressbar" value="" max="100"></progress>
    <br>

  <div uk-grid class="uk-child-width-1-2">
    <div>
      <img src="hoking.png"  alt="Image">
    </div>

    <div>
      <div id="action-buttons" style="display: none; margin-bottom: 15px;">
        <button class="uk-button uk-button-secondary uk-margin-small-right" id="copy-btn">
          <span uk-icon="copy"></span> Copy to Clipboard
        </button>
        <button class="uk-button uk-button-secondary" id="download-btn">
          <span uk-icon="download"></span> Download Text
        </button>
      </div>
      <p class="ocr-text"></p>
    </div>
  </div>


  </div>
<script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
<script>
let img = document.querySelector("img");
let show_text = document.querySelector(".ocr-text");
let btn = document.querySelector("#convert");
let lang = document.querySelector("#language");
let file = document.querySelector("#file");
let progress = document.querySelector(".show-progress");
let actionButtons = document.querySelector("#action-buttons");
let copyBtn = document.querySelector("#copy-btn");
let downloadBtn = document.querySelector("#download-btn");

file.addEventListener('change',function(e){
  
  let r = new FileReader();
  r.readAsDataURL(file.files[0]);

  r.onload = function (e){
    img.src = e.target.result
  };
})

btn.onclick = function () {convert()}
function convert(){
  Tesseract.recognize(
    img.src,
    lang.value, 
    {
      logger: m => {
        console.log(m)
        var bar = document.getElementById('js-progressbar');
        bar.value = m.progress.toFixed(2) * 100;
      }
    }
  ).then(({data: {text}}) => {
    console.log(text);
    show_text.innerText = text;
    // Show action buttons when text is available
    if (text && text.trim().length > 0) {
      actionButtons.style.display = 'block';
    }
  }).catch((err) => {
    console.log(err)
  })
}

// Copy to clipboard functionality
copyBtn.onclick = function() {
  const text = show_text.innerText;
  if (text && text.trim().length > 0) {
    navigator.clipboard.writeText(text).then(() => {
      // Show success notification
      UIkit.notification({
        message: 'Text copied to clipboard!',
        status: 'success',
        pos: 'top-center',
        timeout: 2000
      });
    }).catch(err => {
      console.error('Failed to copy text: ', err);
      UIkit.notification({
        message: 'Failed to copy text',
        status: 'danger',
        pos: 'top-center',
        timeout: 2000
      });
    });
  }
}

// Download text functionality
downloadBtn.onclick = function() {
  const text = show_text.innerText;
  if (text && text.trim().length > 0) {
    // Create a blob with the text content
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    
    // Create a temporary link and trigger download
    const a = document.createElement('a');
    a.href = url;
    a.download = 'converted-text.txt';
    document.body.appendChild(a);
    a.click();
    
    // Clean up
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    // Show success notification
    UIkit.notification({
      message: 'Text file downloaded!',
      status: 'success',
      pos: 'top-center',
      timeout: 2000
    });
  }
}

</script>
</body>
</html>
